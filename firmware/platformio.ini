; Beacon-notaio WeMeet — build PlatformIO.
;
;   pio run -t upload -t monitor
;
; La cartella dello sketch è la stessa che apre l'Arduino IDE: una sola copia
; di rotating_code.c, due toolchain. Vedi README.md.

[platformio]
src_dir = attendee_beacon

[env:esp32dev]
; Versioni pinnate: questo esatto insieme è stato compilato e verificato.
platform = espressif32@^7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
; Niente OTA: tutto lo spazio all'applicazione. Con lo schema di default
; il binario sta al 78% e non lascia margine.
board_build.partitions = huge_app.csv
build_flags =
    -Wall
