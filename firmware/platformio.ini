; Beacon-notaio WeMeet — build PlatformIO.
;
;   pio run -t upload -t monitor
;
; La cartella dello sketch è la stessa che apre l'Arduino IDE: una sola copia
; di rotating_code.c, due toolchain. Vedi README.md.

[platformio]
src_dir = attendee_beacon

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
build_flags =
    -Wall
