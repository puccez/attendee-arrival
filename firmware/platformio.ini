; Beacon-notaio WeMeet — build PlatformIO.
;
;   pio run -t upload -t monitor
;
; La cartella dello sketch è la stessa che apre l'Arduino IDE: una sola copia
; di rotating_code.c, due toolchain. Vedi README.md.

[platformio]
src_dir = attendee_beacon

; Impostazioni comuni alle varianti di board.
[env]
; Versioni pinnate: questo esatto insieme è stato compilato e verificato.
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
; Niente OTA: tutto lo spazio all'applicazione. Con lo schema di default
; il binario sta al 78% e non lascia margine.
board_build.partitions = huge_app.csv
build_flags =
    -Wall

; Board dell'utente: ESP32-C6 (RISC-V, BLE 5.0), flash 4 MB, bridge
; seriale WCH CH343 su /dev/ttyACM0.
;
; Il C6 richiede l'Arduino core 3.x: la piattaforma ufficiale
; espressif32@7.x ne include ancora la 2.x e risponde "This board doesn't
; support arduino framework". Il fork pioarduino è la via standard.
[env:esp32-c6-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitm-1

; ESP32 classico (WROOM-32): la variante su cui è nato il firmware.
[env:esp32dev]
platform = espressif32@^7.0.1
board = esp32dev
